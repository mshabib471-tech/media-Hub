name: mediahub_downloader
description: A modern, compliant Flutter download manager for authorized media downloads.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0+1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  file_picker: ^8.0.6
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.5.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.2.3
  logging: ^1.2.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
